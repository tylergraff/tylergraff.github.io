title: Tyler Graff
description: Systems engineer for first-of-kind technical systems.
url: https://tylergraff.github.io
baseurl: ""

# Jekyll settings
markdown: kramdown
permalink: /:title/

# Force ASCII output: keep quotes straight and typographic symbols as plain
# ASCII sequences instead of Unicode dashes/ellipses.
kramdown:
  smart_quotes: [39, 39, 34, 34]
  typographic_symbols:
    mdash: "--"
    ndash: "-"
    hellip: "..."
    laquo: "<<"
    raquo: ">>"

# Plugins limited to search-engine/subscriber discoverability
# (RSS feed + sitemap.xml) -- nothing else.
plugins:
  - jekyll-feed
  - jekyll-sitemap
