<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - {{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">

    <!-- Open Graph / Twitter Card: minimal tags so shared links render a
         proper title, description, and image preview. -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title }} - {{ site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:image" content="{{ site.url }}/assets/favicons/favicon-512x512.png">
    <meta name="twitter:card" content="summary">

    <link rel="stylesheet" href="/assets/css/main.css">
    
    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/assets/favicons/favicon-32x32.svg">
    <link rel="icon" type="image/png" href="/assets/favicons/favicon-16x16.png" sizes="16x16">
    <link rel="icon" type="image/png" href="/assets/favicons/favicon-32x32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="/assets/favicons/favicon-192x192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="/assets/favicons/apple-touch-icon.png">
    <meta name="msapplication-TileImage" content="/assets/favicons/mstile-150x150.png">
    <meta name="msapplication-TileColor" content="#11110f">
</head>
<body>
    {% include header.html %}
    
    <main>
        {{ content }}
    </main>
    
    {% include footer.html %}
</body>
</html>
